name: Capture ClippyMe dashboard demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-screenshot.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "requirements*.txt"
      - "src/**"
      - "dashboard/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clippyme-demo-screenshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and launch ClippyMe
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose up -d --build; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Docker build failed; retrying after a transient package mirror error..."
            sleep $((attempt * 15))
          done

      - name: Wait for the real dashboard and API
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

      - name: Install isolated Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/clippyme-playwright" --no-save --no-audit --no-fund playwright@1.60.0
          "$RUNNER_TEMP/clippyme-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture the running application
        env:
          NODE_PATH: ${{ runner.temp }}/clippyme-playwright/node_modules
        run: |
          mkdir -p docs/assets
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1050 },
              deviceScaleFactor: 1,
            });
            page.setDefaultTimeout(30000);
            await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle', timeout: 120000 });
            await page.getByPlaceholder(/Paste a video link/i).waitFor({ state: 'visible' });
            await page.screenshot({
              path: 'docs/assets/clippyme-dashboard.png',
              fullPage: true,
              animations: 'disabled',
            });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop the temporary app
        if: always()
        run: docker compose down --remove-orphans

      - name: Commit the genuine application screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-tree -r --name-only origin/main docs/assets/clippyme-dashboard.png | grep -Fxq "docs/assets/clippyme-dashboard.png"; then
            echo "A genuine dashboard screenshot is already committed; no duplicate commit is needed."
          else
            git add docs/assets/clippyme-dashboard.png
            git commit -m "Add screenshot of the running ClippyMe dashboard"
            git pull --rebase origin main
            git push
          fi
