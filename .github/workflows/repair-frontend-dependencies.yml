name: One-time frontend dependency repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-frontend-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: frontend-dependency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Update Vite and classify build tooling as development-only
        working-directory: dashboard
        run: npm install --save-dev "vite@^6.4.6" "@tailwindcss/vite@^4.2.2" --no-audit --no-fund

      - name: Audit production dependencies
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Verify frontend lint, tests and production build
        working-directory: dashboard
        run: |
          npm run lint
          npm test -- --coverage
          npm run build

      - name: Commit the refreshed lockfile and remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package.json dashboard/package-lock.json
          git rm .github/workflows/repair-frontend-dependencies.yml
          git commit -m "fix: patch Vite and refresh frontend dependency lock"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
