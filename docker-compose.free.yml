# Optional subscription-free publishing stack.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.free.yml up -d --build
#
# This bundles the official self-hosted Postiz image and its required local
# services. It does not remove YouTube/Instagram/TikTok API quotas.

services:
  backend:
    environment:
      - CLIPPYME_PUBLISHER=${CLIPPYME_PUBLISHER:-postiz}
      - POSTIZ_BASE_URL=${POSTIZ_BASE_URL:-http://postiz:5000/public/v1}
      - POSTIZ_API_KEY=${POSTIZ_API_KEY:-}
    depends_on:
      - postiz

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: clippyme-postiz
    restart: unless-stopped
    environment:
      MAIN_URL: http://localhost:4007
      FRONTEND_URL: http://localhost:4007
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4007/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-change-this-local-secret}
      DATABASE_URL: postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: 30
      FEE_AMOUNT: 0
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    ports:
      - "${POSTIZ_PORT:-4007}:5000"
    networks:
      - clippyme-net
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    container_name: clippyme-postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: redis:7.2
    container_name: clippyme-postiz-redis
    restart: unless-stopped
    volumes:
      - postiz-redis:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-postgres:
    image: postgres:16
    container_name: clippyme-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    networks:
      - temporal-network

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: clippyme-temporal-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - temporal-elasticsearch:/usr/share/elasticsearch/data
    networks:
      - temporal-network

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: clippyme-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - temporal-network
    depends_on:
      - temporal-postgres
      - temporal-elasticsearch

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:
  temporal-postgres:
  temporal-elasticsearch:

networks:
  clippyme-net:
    external: true
    name: clippyme_clippyme-net
  postiz-network:
  temporal-network:
